<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseño CTA — Preview animado</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060d1f; font-family: 'Segoe UI', sans-serif; color: white; }

  h1.page-title {
    text-align: center;
    padding: 24px;
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky;
    top: 0;
    background: #060d1f;
    z-index: 100;
  }

  .scroll-hint {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    color: rgba(0,200,255,0.6);
    position: sticky;
    top: 45px;
    background: #060d1f;
    z-index: 100;
  }

  /* ── SERVICES MOCK ── */
  .services-mock {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #060d1f;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .services-mock .label {
    color: rgba(0,200,255,0.35);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
  }
  .services-mock .label::after {
    content: '\A↓ scroll para ver la card CTA subir';
    white-space: pre;
    display: block;
    margin-top: 12px;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }

  /* ── CARD RISE ── */
  .cta-card {
    border-radius: 32px 32px 0 0;
    overflow: hidden;
    transform: translateY(100px);
    opacity: 0;
    transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    border-top: 1px solid rgba(0,200,255,0.3);
    box-shadow: 0 -24px 60px rgba(0,200,255,0.14);
  }
  .cta-card.risen {
    transform: translateY(0);
    opacity: 1;
  }

  /* ── SLIDES ── */
  @keyframes bgFade {
    to { background-color: var(--bg); }
  }
  @keyframes slideInLeft {
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInRight {
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInTop {
    to { opacity: 1; transform: translateY(0); }
  }

  .cr-slide {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    position: relative;
    background-color: white;
    animation: bgFade 0.2s linear;
    animation-play-state: paused;
    animation-fill-mode: both;
    animation-iteration-count: 1;
  }

  .cr-slide-1 {
    --bg: #00c8ff;
    --delay: 0;
  }
  .cr-slide-2 {
    --bg: #0038cc;
    --delay: 0.33;
  }
  .cr-slide-3 {
    --bg: #ffffff;
    --delay: 0.66;
  }

  .cr-slide h1 {
    font-size: clamp(32px, 5.5vw, 72px);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1.1;
    opacity: 0;
    animation-play-state: paused;
    animation-fill-mode: both;
    animation-iteration-count: 1;
  }

  .cr-slide-1 {
    overflow: hidden;
  }
  .cr-slide-1 h1 {
    color: #060d1f;
    transform: translateX(-110vw);
    animation: slideInLeft 0.1s linear;
  }
  .cr-slide-1 h1 em {
    color: #0038cc;
    font-style: normal;
  }

  .cr-slide-2 {
    overflow: hidden;
  }
  .cr-slide-2 h1 {
    color: #ffffff;
    transform: translateX(110vw);
    animation: slideInRight 0.1s linear;
  }

  /* Slide 3: overflow hidden so text enters from top edge of its own block */
  .cr-slide-3 {
    overflow: hidden;
  }
  .cr-slide-3 h1 {
    color: #060d1f;
    transform: translateY(-100%);
    animation: slideInTop 0.1s linear;
  }
  .cr-slide-3 h1 em {
    color: #0038cc;
    font-style: normal;
  }

  :root { --local-scroll: 0; }

  .cr-animate {
    animation-play-state: paused !important;
    animation-delay: calc((var(--local-scroll) - var(--delay)) * -1s) !important;
  }
</style>
</head>
<body>

<h1 class="page-title">Preview — Scroll para ver la animación</h1>
<p class="scroll-hint">↓ Scrolleá hacia abajo para ver el efecto</p>

<!-- Mock services section -->
<div class="services-mock">
  <div class="label">Sección Servicios (mock)</div>
</div>

<!-- CTA Card -->
<div class="cta-card" id="ctaCard">

  <div class="cr-slide cr-slide-1 cr-animate" style="--delay:0">
    <h1 class="cr-animate" style="--delay:0">
      No solo creamos código,<br>diseñamos tu <em>futuro</em>
    </h1>
  </div>

  <div class="cr-slide cr-slide-2 cr-animate" style="--delay:0.33">
    <h1 class="cr-animate" style="--delay:0.33">
      ¿Listo para escalar<br>tu negocio?
    </h1>
  </div>

  <div class="cr-slide cr-slide-3 cr-animate" style="--delay:0.66">
    <h1 class="cr-animate" style="--delay:0.66">
      Lo que hacemos habla<br><em>por nosotros</em>
    </h1>
  </div>

</div>

<!-- Rest of page mock -->
<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#060d1f;">
  <p style="color:rgba(255,255,255,0.25);font-size:12px;letter-spacing:2px;">Logo Carousel → Skills → CTA existente</p>
</div>

<script>
  const card = document.getElementById('ctaCard');
  const root = document.documentElement.style;

  // Card rise on scroll into view
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        card.classList.add('risen');
        observer.disconnect();
      }
    });
  }, { threshold: 0.05 });
  observer.observe(card);

  // Scroll-driven animation inside card
  function tick() {
    const cardRect = card.getBoundingClientRect();
    const cardTop = card.offsetTop;
    const cardScrollable = card.offsetHeight - window.innerHeight;
    const progress = Math.max(0, Math.min(1,
      (window.pageYOffset - cardTop) / cardScrollable
    ));
    root.setProperty('--local-scroll', progress);
  }

  window.addEventListener('scroll', tick, { passive: true });
  tick();
</script>
</body>
</html>
