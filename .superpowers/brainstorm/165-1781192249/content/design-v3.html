<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseño CTA v3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060d1f; font-family: 'Segoe UI', sans-serif; color: white; }

  h1.page-title {
    text-align: center; padding: 16px; font-size: 12px;
    color: rgba(255,255,255,0.4); letter-spacing: 2px; text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0; background: #060d1f; z-index: 100;
  }

  .services-mock {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #060d1f;
  }
  .services-mock p {
    color: rgba(0,200,255,0.35); font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase; text-align: center;
  }
  .services-mock p::after {
    content: '\A↓ scroll'; white-space: pre; display: block;
    margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.2);
  }

  .cta-card {
    border-radius: 32px 32px 0 0; overflow: hidden;
    transform: translateY(120px); opacity: 0;
    transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.9s ease;
    border-top: 1px solid rgba(0,200,255,0.3);
    box-shadow: 0 -24px 60px rgba(0,200,255,0.14);
  }
  .cta-card.risen { transform: translateY(0); opacity: 1; }

  @keyframes bgFade {
    from { background-color: #060d1f; }
    to   { background-color: var(--bg); }
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-110vw); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(110vw); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInDown {
    from { opacity: 0; transform: translateY(-100%); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* full shorthand so fill-mode never gets reset */
  .cr-slide {
    height: 65vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 40px; background-color: #060d1f;
    animation: bgFade 0.2s linear 0s 1 normal both paused;
  }
  .cr-slide-1 { --bg: #00a8d6; overflow: hidden; }
  .cr-slide-2 { --bg: #0052a3; overflow: hidden; }
  .cr-slide-3 { --bg: #002f6c; overflow: hidden; }

  /* content wrapper carries the slide-in — h1 and arrow enter as one unit */
  .cr-content {
    display: flex; flex-direction: column; align-items: center;
  }

  .cr-slide h1 {
    font-size: clamp(28px, 5vw, 68px); font-weight: 900;
    letter-spacing: -2px; line-height: 1.1;
  }

  .cr-slide-1 .cr-content {
    animation: slideInLeft 0.15s linear 0s 1 normal both paused;
    color: rgba(255,255,255,0.92);
  }
  .cr-slide-1 h1 em { color: #ffffff; font-style: normal; text-shadow: 0 0 20px rgba(255,255,255,0.4); }

  .cr-slide-2 .cr-content {
    animation: slideInRight 0.15s linear 0s 1 normal both paused;
    color: rgba(255,255,255,0.92);
  }

  .cr-slide-3 .cr-content {
    animation: slideInDown 0.15s linear 0s 1 normal both paused;
    color: rgba(255,255,255,0.92);
  }
  .cr-slide-3 h1 em { color: #00c8ff; font-style: normal; }

  /* per-slide scroll */
  .cr-anim-bg  { animation-delay: calc(var(--slide-scroll, 0) * -0.2s)  !important; }
  .cr-anim-txt { animation-delay: calc(var(--slide-scroll, 0) * -0.15s) !important; }

  @keyframes bounce-arrow {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(12px); }
  }

  .scroll-arrow {
    display: block;
    margin-top: 24px;
    font-size: 36px;
    animation: bounce-arrow 1.1s ease-in-out infinite paused;
    pointer-events: none;
  }
  .cr-slide.done .scroll-arrow {
    animation-play-state: running;
  }
</style>
</head>
<body>

<h1 class="page-title">↓ Scrolleá para ver el efecto</h1>

<div class="services-mock"><p>Sección Servicios</p></div>

<div class="cta-card" id="ctaCard">

  <div class="cr-slide cr-slide-1 cr-anim-bg">
    <div class="cr-content cr-anim-txt">
      <h1>No solo creamos código,<br>diseñamos tu <em>futuro</em></h1>
      <span class="scroll-arrow">↓</span>
    </div>
  </div>

  <div class="cr-slide cr-slide-2 cr-anim-bg">
    <div class="cr-content cr-anim-txt">
      <h1>¿Listo para escalar<br>tu negocio?</h1>
      <span class="scroll-arrow">↓</span>
    </div>
  </div>

  <div class="cr-slide cr-slide-3 cr-anim-bg">
    <div class="cr-content cr-anim-txt">
      <h1>Lo que hacemos habla<br><em>por nosotros</em></h1>
      <span class="scroll-arrow">↓</span>
    </div>
  </div>

</div>

<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#060d1f;">
  <p style="color:rgba(255,255,255,0.2);font-size:11px;letter-spacing:2px;">Logo Carousel → Skills → CTA</p>
</div>

<script>
  const card = document.getElementById('ctaCard');
  const root = document.documentElement.style;
  let cardReady = false;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { card.classList.add('risen'); observer.disconnect(); }
    });
  }, { threshold: 0.05 });
  observer.observe(card);

  const slides = Array.from(card.querySelectorAll('.cr-slide'));

  function tick() {
    const vh = window.innerHeight;
    const cardTop = card.getBoundingClientRect().top;

    // Slide 1: starts at cardTop=1.5vh (before card fully in view), done at cardTop=0
    const s1 = Math.max(0, Math.min(1, (vh * 1.5 - cardTop) / (vh * 1.5)));
    slides[0].style.setProperty('--slide-scroll', s1);
    slides[0].classList.toggle('done', s1 >= 0.95);

    // Slide 2: starts when card.top=0, ends when slide 2 center is at viewport center
    // slide 2 center at viewport center = s2top = vh*0.5 - slideHeight*0.5 = vh*0.5 - vh*0.325 = vh*0.175
    const s2top = slides[1].getBoundingClientRect().top;
    const s2 = Math.max(0, Math.min(1, (vh * 0.65 - s2top) / (vh * 0.475)));
    slides[1].style.setProperty('--slide-scroll', s2);
    slides[1].classList.toggle('done', s2 >= 0.95);

    // Slide 3: starts when slide 3 top is at 65% of viewport
    const s3top = slides[2].getBoundingClientRect().top;
    const s3 = Math.max(0, Math.min(1, (vh * 0.65 - s3top) / (vh * 0.57)));
    slides[2].style.setProperty('--slide-scroll', s3);
    slides[2].classList.toggle('done', s3 >= 0.95);
  }

  window.addEventListener('scroll', tick, { passive: true });
  tick();
</script>
</body>
</html>
