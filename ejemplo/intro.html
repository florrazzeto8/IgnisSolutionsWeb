<!-- SERVICES INTRO -->
<section class="services-intro" id="servicesIntro">
  <div class="intro-phrase">
    <span class="line">Lo que construimos</span>
    <button class="escribinos-btn" id="escribinosBtn">Escribinos ↗</button>
    <span class="line">para vos</span>
  </div>
</section>

<!-- CONTACT MODAL -->
<div id="contactModal" class="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <h3>Hablemos de tu proyecto</h3>
    <p class="modal-sub">Completá el formulario y te respondemos en menos de 24hs.</p>
    <form onsubmit="return false">
      <div class="form-group">
        <input type="text" placeholder="Tu nombre completo" required>
      </div>
      <div class="form-group">
        <input type="email" placeholder="Email de contacto" required>
      </div>
      <div class="form-group">
        <input type="text" placeholder="Empresa / Proyecto">
      </div>
      <div class="form-group">
        <textarea placeholder="Contanos sobre tu idea..." rows="4"></textarea>
      </div>
      <button type="submit" style="width:100%;justify-content:center">Enviar mensaje →</button>
    </form>
  </div>
</div>
